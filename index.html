<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CROME - Crop Map of England</title>
<script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  #map { position: absolute; top: 40px; bottom: 0; width: 100%; }
  #controls {
    position: absolute; top: 0; left: 0; right: 0; height: 40px;
    background: #222; color: #fff; display: flex; align-items: center;
    padding: 0 16px; gap: 12px; z-index: 10; font-size: 14px;
  }
  .year-btn {
    padding: 4px 12px; border: 1px solid #555; border-radius: 4px;
    background: #333; color: #ccc; cursor: pointer; font-size: 13px;
  }
  .year-btn.active { background: #4a9; color: #fff; border-color: #4a9; }
  .year-btn.unavailable { opacity: 0.3; cursor: not-allowed; }
  #legend {
    position: absolute; bottom: 30px; right: 10px; background: rgba(255,255,255,0.92);
    padding: 10px 14px; border-radius: 6px; font-size: 12px; z-index: 5;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  #legend div { display: flex; align-items: center; margin: 3px 0; cursor: pointer; user-select: none; }
  #legend div.off { opacity: 0.35; text-decoration: line-through; }
  #legend span { width: 14px; height: 14px; display: inline-block; margin-right: 6px; border-radius: 2px; flex-shrink: 0; }
  #status { color: #aaa; margin-left: auto; font-size: 12px; }
  #confidence-toggle { display: flex; align-items: center; gap: 4px; color: #aaa; font-size: 12px; cursor: pointer; }
  #confidence-toggle input { cursor: pointer; }
  #confidence-toggle.disabled { opacity: 0.3; pointer-events: none; }
  #info-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 22px;
    background: rgba(0,0,0,0.7); color: #bbb; font-size: 11px;
    display: flex; align-items: center; padding: 0 10px; gap: 16px; z-index: 5;
  }
  #info-bar a { color: #8cf; }
</style>
</head>
<body>
<div id="controls">
  <strong>CROME</strong>
  <span id="year-buttons"></span>
  <label id="confidence-toggle" class="disabled" title="Modulate opacity by classification probability">
    <input type="checkbox" id="shade-by-prob"> Shade by confidence
  </label>
  <span id="status"></span>
</div>
<div id="map"></div>
<div id="legend">
  <div data-class="AC"><span style="background:#FFFF00"></span> AC - Arable Crops</div>
  <div data-class="FA"><span style="background:#FFAA00"></span> FA - Fallow</div>
  <div data-class="HE"><span style="background:#B4783C"></span> HE - Heather</div>
  <div data-class="LG"><span style="background:#C8C864"></span> LG - Legumes/Grass</div>
  <div data-class="PG"><span style="background:#AAFF00"></span> PG - Perm. Grassland</div>
  <div data-class="WO"><span style="background:#00A800"></span> WO - Woodland</div>
  <div data-class="SR"><span style="background:#FF55FF"></span> SR - Short Rotation</div>
  <div data-class="WA"><span style="background:#0070FF"></span> WA - Water</div>
  <div data-class="NA"><span style="background:#BEBEBE"></span> NA - Non-Agricultural</div>
</div>
<div id="info-bar">
  <span>Data: <a href="https://www.data.gov.uk/dataset/be5d88c9-acfb-4052-bf6b-ee9a416cfe60/crop-map-of-england-crome" target="_blank">CROME</a> &copy; Environment Agency / Defra (OGL v3)</span>
  <span id="tile-info"></span>
</div>
<script>
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

const YEARS = [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
const PROB_YEARS = new Set([2020, 2021, 2022, 2023, 2024]);
let currentYear = null;
let shadeByProb = false;

// Detect base URL for PMTiles files
// GitHub Pages doesn't serve LFS files, so use media.githubusercontent.com
const BASE_URL = (() => {
  const loc = window.location;
  if (loc.hostname.endsWith('.github.io')) {
    // Extract user/repo from GitHub Pages URL
    const user = loc.hostname.split('.')[0];
    const repo = loc.pathname.split('/')[1] || '';
    return `https://media.githubusercontent.com/media/${user}/${repo}/main`;
  }
  return loc.origin + loc.pathname.replace(/\/[^/]*$/, '');
})();

const lucodeColors = [
  "match", ["slice", ["get", "lucode"], 0, 2],
  "AC", "#FFFF00",
  "FA", "#FFAA00",
  "HE", "#B4783C",
  "LG", "#C8C864",
  "PG", "#AAFF00",
  "WO", "#00A800",
  "SR", "#FF55FF",
  "TC", "#8C4614",
  "NA", "#006400",
  "WA", "#0070FF",
  "UR", "#BEBEBE",
  "EN", "#FF0000",
  "SH", "#808000",
  "#999999"
];

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster",
        tiles: ["https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png"],
        tileSize: 256,
        attribution: "&copy; <a href='https://carto.com/'>CARTO</a> &copy; <a href='https://www.openstreetmap.org/copyright'>OSM</a>"
      }
    },
    layers: [{ id: "osm", type: "raster", source: "osm" }]
  },
  center: [-1.5, 52.5],
  zoom: 6
});

function pmtilesPath(year) {
  return PROB_YEARS.has(year)
    ? `pmtiles_lucode_prob/crome_${year}.pmtiles`
    : `pmtiles_per_year/crome_${year}.pmtiles`;
}

// Check which years are available
async function checkAvailability() {
  const available = {};
  for (const y of YEARS) {
    const url = `${BASE_URL}/${pmtilesPath(y)}`;
    try {
      const resp = await fetch(url, { method: 'HEAD' });
      available[y] = resp.ok;
    } catch {
      available[y] = false;
    }
  }
  return available;
}

async function init() {
  const available = await checkAvailability();
  const btnContainer = document.getElementById("year-buttons");

  YEARS.forEach(y => {
    const btn = document.createElement("button");
    btn.className = "year-btn" + (available[y] ? "" : " unavailable");
    btn.textContent = y;
    btn.id = "btn-" + y;
    if (available[y]) {
      btn.onclick = () => switchYear(y);
    }
    btnContainer.appendChild(btn);
  });

  // Load first available year
  const firstAvail = YEARS.find(y => available[y]);
  if (firstAvail) switchYear(firstAvail);
  else document.getElementById("status").textContent = "No data available yet";
}

function switchYear(year) {
  document.querySelectorAll(".year-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("btn-" + year).classList.add("active");
  currentYear = year;

  if (map.getLayer("crome-hex")) map.removeLayer("crome-hex");
  if (map.getLayer("crome-fill")) map.removeLayer("crome-fill");
  if (map.getLayer("crome-line")) map.removeLayer("crome-line");
  if (map.getSource("crome")) map.removeSource("crome");

  const pmtilesUrl = `pmtiles://${BASE_URL}/${pmtilesPath(year)}`;

  // Enable/disable confidence toggle
  const toggle = document.getElementById("confidence-toggle");
  if (PROB_YEARS.has(year)) {
    toggle.classList.remove("disabled");
  } else {
    toggle.classList.add("disabled");
    document.getElementById("shade-by-prob").checked = false;
    shadeByProb = false;
  }

  map.addSource("crome", {
    type: "vector",
    url: pmtilesUrl,
    minzoom: 0,
    maxzoom: 12
  });

  // Low zoom: circles (GPU-accelerated, fast)
  map.addLayer({
    id: "crome-hex",
    type: "circle",
    source: "crome",
    "source-layer": "crome",
    maxzoom: 9,
    paint: {
      "circle-radius": ["interpolate", ["linear"], ["zoom"], 0, 1, 5, 2, 7, 3.5, 9, 5],
      "circle-color": lucodeColors,
      "circle-opacity": 0.8
    }
  });

  // Mid-high zoom: actual polygons
  map.addLayer({
    id: "crome-fill",
    type: "fill",
    source: "crome",
    "source-layer": "crome",
    minzoom: 9,
    paint: {
      "fill-color": lucodeColors,
      "fill-opacity": 0.7
    }
  });

  map.addLayer({
    id: "crome-line",
    type: "line",
    source: "crome",
    "source-layer": "crome",
    minzoom: 10,
    paint: {
      "line-color": "#333",
      "line-width": 0.3
    }
  });

  document.getElementById("status").textContent = `Year: ${year}`;

  // Show file info
  const fileUrl = `${BASE_URL}/${pmtilesPath(year)}`;
  fetch(fileUrl, { method: 'HEAD' }).then(r => {
    const bytes = r.headers.get('content-length');
    const mb = bytes ? (bytes / 1048576).toFixed(0) : '?';
    const host = new URL(fileUrl).hostname;
    document.getElementById("tile-info").textContent =
      `PMTiles: ${mb} MB | Served from ${host} via HTTP range requests`;
  }).catch(() => {});

  updateVisibility();
}

// Legend class toggle — use paint opacity instead of filter for speed
const hiddenClasses = new Set();
const ALL_CLASSES = ["AC","FA","HE","LG","PG","WO","SR","TC","NA","WA","UR","EN","SH"];

function updateVisibility() {
  if (!map.getLayer("crome-fill")) return;
  const useProb = shadeByProb && PROB_YEARS.has(currentYear);

  if (hiddenClasses.size === 0 && !useProb) {
    map.setPaintProperty("crome-fill", "fill-opacity", 0.7);
    if (map.getLayer("crome-hex")) map.setPaintProperty("crome-hex", "circle-opacity", 0.8);
  } else if (hiddenClasses.size === 0 && useProb) {
    // prob ranges 0-1; scale to 0.15-0.9 for fill, 0.2-1.0 for circles
    const probFill = ["interpolate", ["linear"], ["coalesce", ["get", "prob"], 1], 0, 0.15, 1, 0.9];
    const probHex = ["interpolate", ["linear"], ["coalesce", ["get", "prob"], 1], 0, 0.2, 1, 1.0];
    map.setPaintProperty("crome-fill", "fill-opacity", probFill);
    if (map.getLayer("crome-hex")) map.setPaintProperty("crome-hex", "circle-opacity", probHex);
  } else {
    // Combine class filtering with optional prob-based opacity
    const baseFill = useProb
      ? ["interpolate", ["linear"], ["coalesce", ["get", "prob"], 1], 0, 0.15, 1, 0.9]
      : 0.7;
    const baseHex = useProb
      ? ["interpolate", ["linear"], ["coalesce", ["get", "prob"], 1], 0, 0.2, 1, 1.0]
      : 0.8;

    const fillExpr = ["case"];
    const hexExpr = ["case"];
    // Hidden classes get 0
    for (const cls of hiddenClasses) {
      const cond = ["==", ["slice", ["get", "lucode"], 0, 2], cls];
      fillExpr.push(cond, 0);
      hexExpr.push(cond, 0);
    }
    fillExpr.push(baseFill);
    hexExpr.push(baseHex);

    map.setPaintProperty("crome-fill", "fill-opacity", fillExpr);
    if (map.getLayer("crome-hex")) map.setPaintProperty("crome-hex", "circle-opacity", hexExpr);
  }
}

document.getElementById("legend").addEventListener("click", (e) => {
  const row = e.target.closest("[data-class]");
  if (!row) return;
  const cls = row.dataset.class;
  if (hiddenClasses.has(cls)) {
    hiddenClasses.delete(cls);
    row.classList.remove("off");
  } else {
    hiddenClasses.add(cls);
    row.classList.add("off");
  }
  updateVisibility();
});

document.getElementById("shade-by-prob").addEventListener("change", (e) => {
  shadeByProb = e.target.checked;
  updateVisibility();
});

map.on("load", init);

function showPopup(e) {
  if (e.features.length > 0) {
    const f = e.features[0];
    const p = f.properties;
    let html = `<strong>${p.lucode}</strong><br>Year: ${p.year || currentYear}`;
    if (p.prob != null) {
      html += `<br>Confidence: ${(p.prob * 100).toFixed(0)}%`;
    }
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(html)
      .addTo(map);
  }
}

["crome-fill", "crome-hex"].forEach(layerId => {
  map.on("click", layerId, showPopup);
  map.on("mouseenter", layerId, () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", layerId, () => map.getCanvas().style.cursor = "");
});
</script>
</body>
</html>
